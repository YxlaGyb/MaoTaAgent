# MaoTa 的插件集。一个能力 id 一个提供方。
#
# 每个插件自带 config 默认值（packages/<name>/src/main.ts），这里只写这个部署
# 真的要改的键 —— 没写的就用插件自己的默认值。
# 能力路由由插件的 provides 推导，不用在这里登记；只有两个插件抢同一个
# 能力才需要写 [capability] 指定谁赢。
#
# 这个文件只说"仓库的事": 有哪些插件、怎么起、系统提示词是什么。机器自己的事
# —— 哪个网关、哪个模型、有没有 key —— 写在 eggshell.local.toml 里，它这样开头:
#
#   extends = ["eggshell.toml"]
#   [plugins.api.config]
#   model = "deepseek-reasoner"
#
# extends 列出的文件先加载，本文件后加载，后写的键赢：表的键逐个合并，数组整体
# 替换。eggshell.local.toml 不提交（在 .gitignore 里）；有它就用它当入口，没有就
# 用本文件（packages/boot/src/main.ts 挑）。改完任意一层跑 pnpm run check:config。
#
# 拼错的 config 键不会静默生效：每个插件的 configKeys 声明了它读哪几个键，多出来的
# 会在 check:config 里被点名（只报不拦）。
#
# command 是裸名字时交给 PATH; args 里的相对路径按插件自己的 cwd 解析（缺省 = 本文件所在目录）。

[plugins.api]
command = "node"
args = ["packages/api/src/main.ts"]
# [plugins.api.config] 在 eggshell.local.toml: 网关、模型、钥匙是每台机器自己的事。
# 一层都不写的话，api 插件落到它自己的默认值（OpenAI 兼容端点 + OPENAI_API_KEY）。

[plugins.shell]
command = "node"
args = ["packages/shell/src/main.ts"]

[plugins.tools]
command = "node"
args = ["packages/tools/src/main.ts"]

[plugins.skill-filesystem]
command = "node"
args = ["packages/skill-filesystem/src/main.ts"]

[plugins.skill]
command = "node"
args = ["packages/skill/src/main.ts"]

[plugins.agent]
command = "node"
args = ["packages/agent/src/main.ts"]
[plugins.agent.config]
# 模型不知道自己在哪、工具在哪儿跑 —— 这里补上。技能表由 skill 插件自己追加。
system = "你是 MaoTa 的编码助手，跑在 Windows 上，工作目录就是 MaoTa 仓库根。要看代码、要看目录、要跑命令就用 shell 工具，别凭印象猜，也别用 tail/sed 这类 Unix 命令。回答用用户的语言，短。"
