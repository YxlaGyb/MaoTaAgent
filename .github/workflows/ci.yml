name: ci

on:
  push:
  pull_request:

jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 冒烟测试要一个真内核进程（eggshellmod 的构建产物），所以 CI 只做类型检查。
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check