name: ci

on:
  push:
  pull_request:

jobs:
  types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MaoTa
    steps:
      - uses: actions/checkout@v4
        with:
          path: MaoTa
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/MaoTaUI
          path: MaoTaUI
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: MaoTa/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: pnpm run check
