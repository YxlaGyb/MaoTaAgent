# MaoTa's plugin set: one provider per capability id.
#
# The CLI generates this file into $MAOTA_HOME (default ~/.maota) on a first run. What is
# specific to one machine goes into eggshell.local.toml beside it: that file extends this
# one, and later keys win.
#
# Entry points are absolute paths baked in at generation time, so this file keeps working
# from wherever it is copied.
# A misspelled config key never takes effect quietly: each plugin's configKeys declares the
# keys it reads, and anything extra is named by check:config (reported, never blocked).
# A disabled row stays configured but is never started; override it to false to enable it,
# and the reloader notices on its own.

[plugins.api]
command = "node"
args = ["{{repo}}/packages/api/src/main.ts"]

[plugins.shell]
command = "node"
args = ["{{repo}}/packages/shell/src/main.ts"]

[plugins.tools]
command = "node"
args = ["{{repo}}/packages/tools/src/main.ts"]

[plugins.skill-filesystem]
command = "node"
args = ["{{repo}}/packages/skill-filesystem/src/main.ts"]

[plugins.skill]
command = "node"
args = ["{{repo}}/packages/skill/src/main.ts"]

[plugins.agent]
command = "node"
args = ["{{repo}}/packages/agent/src/main.ts"]
[plugins.agent.config]
system = "You are MaoTa's coding assistant, running on Windows with the MaoTa repository root ({{repo}}) as the working directory. Use the shell tool to read code, list directories and run commands; do not guess, and do not reach for Unix commands such as tail or sed. Answer in the user's language, briefly."

[plugins.hmr]
disabled = true
command = "node"
args = ["{{repo}}/packages/hmr/src/main.ts"]
[plugins.hmr.config]
roots = ["{{repo}}/apps", "{{repo}}/packages"]